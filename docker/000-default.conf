<VirtualHost *:80>
    DocumentRoot /var/www/html/backend-sn

    <Directory /var/www/html/backend-sn>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Passar variáveis de ambiente do Render/host para o PHP
    PassEnv DB_URL
    PassEnv DB_SSL
    PassEnv DB_SSL_CA
    PassEnv MAIL_USERNAME
    PassEnv MAIL_PASSWORD
    PassEnv VAPID_PUBLIC_KEY
    PassEnv VAPID_PRIVATE_KEY
    PassEnv VAPID_SUBJECT
    PassEnv PUSH_ADMIN_SECRET
    PassEnv BACKEND_URL
    PassEnv FRONTEND_URL
    PassEnv CRON_SECRET

    # O header Authorization chega ao PHP via a regra RewriteRule em
    # backend-sn/.htaccess (mais segura aqui: um erro em .htaccess não
    # impede o Apache de arrancar, ao contrário de um erro no vhost).

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
